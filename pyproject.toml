[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-agent"
version = "0.4.0"
description = "可扩展的 LangGraph 多 Agent 协作框架"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  "langgraph>=1.0.0",
  "langchain>=1.0.0",
  "langchain-openai>=1.0.0",
  "langgraph-checkpoint-sqlite>=2.0.0",
  "python-dotenv>=1.0.1",
  "pydantic>=2.9.0",
]

[project.optional-dependencies]
api = ["fastapi>=0.115.0", "uvicorn>=0.30.0"]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.6.0",
  "mypy>=1.11.0",
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
]

[project.scripts]
multi-agent = "multi_agent.cli:main"
multi-agent-api = "multi_agent.api.__main__:main"

[project.urls]
Homepage = "https://github.com/LuOzawa/langgraph-multi-agent"
Repository = "https://github.com/LuOzawa/langgraph-multi-agent"
Issues = "https://github.com/LuOzawa/langgraph-multi-agent/issues"
Changelog = "https://github.com/LuOzawa/langgraph-multi-agent/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
multi_agent = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
